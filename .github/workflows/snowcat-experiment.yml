name: SnowCat experiment
on:
  workflow_dispatch:
  push:
    branches: ['codex/snowcat-adapter']
permissions:
  contents: read
concurrency:
  group: snowcat-experiment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and test XiaomiZhou adapter
        working-directory: xiaomizhou
        run: |
          npm install -g pnpm@11.25.0
          pnpm install --frozen-lockfile
          node --test test/*.test.js
      - name: Fetch checksum-pinned upstream source
        run: node xiaomizhou/scripts/prepare-snowcat-source.js /tmp/snowcat-source
      - name: Require usable upstream WebUI credentials
        run: node xiaomizhou/scripts/check-snowcat-auth.js /tmp/snowcat-source --require-working
  linux-runtime:
    needs: compatibility
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build SnowCat-only Linux image
        run: |
          base="$(node xiaomizhou/scripts/prepare-qq-image.js)"
          docker build -f xiaomizhou/Dockerfile.bundled --build-arg "QQ_BASE_IMAGE=$base" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t xiaomizhou/snowcat-experiment:local xiaomizhou
      - name: Require real runtime and QR login
        run: |
          docker run -d --name xiaomizhou-qq-smoke --shm-size=256m -p 127.0.0.1:18090:8090 xiaomizhou/snowcat-experiment:local
          trap 'docker rm -fv xiaomizhou-qq-smoke >/dev/null 2>&1 || true' EXIT
          if ! node xiaomizhou/scripts/smoke-bundled.js http://127.0.0.1:18090 snowcat; then
            node xiaomizhou/scripts/diagnose-bundled.js
            exit 1
          fi
      - name: Publish verified SnowCat preview
        if: github.ref == 'refs/heads/codex/snowcat-adapter'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag xiaomizhou/snowcat-experiment:local "$image:snowcat-${GITHUB_SHA:0:7}"
          docker tag xiaomizhou/snowcat-experiment:local "$image:snowcat-preview"
          docker push "$image:snowcat-${GITHUB_SHA:0:7}"
          docker push "$image:snowcat-preview"
# Preview tags only: production latest and version tags are unchanged.
