name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate version and build release bundle
        working-directory: xiaomizhou
        run: |
          node -e "const p=require('./package.json'); if ('v'+p.version !== process.env.GITHUB_REF_NAME) process.exit(1)"
          node scripts/bundle-release.js release
      - name: Build and publish container image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "$image:$GITHUB_REF_NAME" -t "$image:latest" ./xiaomizhou
          docker push "$image:$GITHUB_REF_NAME"
          docker push "$image:latest"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="xiaomizhou/docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" xiaomizhou/release/* --title "xiaomizhou $GITHUB_REF_NAME" --notes-file "$notes" --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" xiaomizhou/release/* --title "xiaomizhou $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
