name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate version and build release bundle
        working-directory: xiaomizhou
        run: |
          node -e "const p=require('./package.json'); if ('v'+p.version !== process.env.GITHUB_REF_NAME) process.exit(1)"
          node scripts/bundle-release.js release
      - name: Build and publish container image
        env:
          GH_TOKEN: ${{ github.token }}
          NAPCAT_BASE_IMAGE: ${{ vars.NAPCAT_BASE_IMAGE }}
        run: |
          if [ -z "$NAPCAT_BASE_IMAGE" ]; then
            NAPCAT_BASE_IMAGE="$(node xiaomizhou/scripts/prepare-napcat-image.js)"
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -f ./xiaomizhou/Dockerfile.bundled --build-arg "NAPCAT_BASE_IMAGE=$NAPCAT_BASE_IMAGE" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "$image:$GITHUB_REF_NAME" -t "$image:latest" ./xiaomizhou
          docker run -d --name xiaomizhou-qq-smoke --shm-size=256m -p 127.0.0.1:18090:8090 "$image:$GITHUB_REF_NAME"
          trap 'docker rm -fv xiaomizhou-qq-smoke >/dev/null 2>&1 || true' EXIT
          node xiaomizhou/scripts/smoke-bundled.js
          docker push "$image:$GITHUB_REF_NAME"
          docker push "$image:latest"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="xiaomizhou/docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" xiaomizhou/release/* --title "xiaomizhou $GITHUB_REF_NAME" --notes-file "$notes" --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" xiaomizhou/release/* --title "xiaomizhou $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
